<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#171a22"><title>WebPS · 浏览器图像编辑器</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark">W</span> WebPS <small>browser image editor</small></div><div class="top-actions"><label class="button primary" for="file-input">导入图片</label><input id="file-input" type="file" accept="image/*,.tga" hidden><button id="new-document">新建画布</button><button id="undo-button" title="撤销 (Ctrl+Z)">↶</button><button id="redo-button" title="重做 (Ctrl+Shift+Z)">↷</button><span class="divider"></span><select id="export-format" aria-label="导出格式"><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WebP</option><option value="tga">TGA</option></select><button id="export-button" class="primary">导出</button></div></header>
<main class="workspace"><aside class="toolbar" aria-label="工具栏"><button class="tool active" data-tool="brush" title="画笔 (B)">✎<span>画笔</span></button><button class="tool" data-tool="eraser" title="橡皮擦 (E)">⌫<span>擦除</span></button><button class="tool" data-tool="eyedropper" title="吸管 (I)">◉<span>取色</span></button><button class="tool" data-tool="select" title="矩形选区 (M)">▧<span>选区</span></button><button id="copy-selection" class="tool" title="复制选区像素 (Ctrl/Cmd+C)">⧉<span>复制</span></button><button id="cut-selection" class="tool" title="剪切选区像素 (Ctrl/Cmd+X)">✂<span>剪切</span></button><button id="paste-selection" class="tool" title="粘贴选区像素 (Ctrl/Cmd+V)">▣<span>粘贴</span></button><button class="tool" data-tool="hand" title="移动画布 (H)">✋<span>移动</span></button><span class="toolbar-rule"></span><button id="clear-selection" class="tool" title="取消选区">⊘<span>取消选区</span></button></aside>
<section class="stage-wrap"><div class="stage-toolbar"><button id="zoom-out">−</button><span id="zoom-label">100%</span><button id="zoom-in">+</button><span class="divider"></span><button id="fit-canvas">适合屏幕</button><span id="document-size"></span></div><div class="canvas-viewport" id="canvas-viewport"><div class="canvas-shell" id="canvas-shell"><canvas id="display-canvas" aria-label="图像编辑画布"></canvas><canvas id="interaction-canvas"></canvas></div></div></section>
<aside class="properties"><section class="panel tool-options"><div class="panel-title"><span>工具属性</span></div><div class="control-row"><label>工具</label><strong id="tool-name">画笔</strong></div><div class="control-row"><label for="brush-color">颜色</label><input id="brush-color" type="color" value="#f5a524"></div><div class="control-row"><label for="brush-size">大小 <output id="brush-size-value">28</output></label><input id="brush-size" type="range" min="1" max="300" value="28"></div><div class="control-row"><label for="brush-hardness">硬度 <output id="brush-hardness-value">82%</output></label><input id="brush-hardness" type="range" min="0" max="100" value="82"></div><div class="control-row"><label for="brush-opacity">不透明度 <output id="brush-opacity-value">100%</output></label><input id="brush-opacity" type="range" min="1" max="100" value="100"></div><div class="brushes" id="brush-presets"></div></section>
<section class="panel adjustments"><div class="panel-title"><span>快速调整</span><button id="reset-adjustments">重置</button></div><label>亮度 <output id="brightness-value">0</output><input id="brightness" type="range" min="-100" max="100" value="0"></label><label>对比度 <output id="contrast-value">0</output><input id="contrast" type="range" min="-100" max="100" value="0"></label><label>饱和度 <output id="saturation-value">0</output><input id="saturation" type="range" min="-100" max="100" value="0"></label><button id="apply-adjustments">应用到当前图层</button></section>
<section class="panel effects"><div class="panel-title"><span>滤镜与描边</span></div><div class="effect-grid"><button data-filter="gaussian">高斯模糊</button><button data-filter="box">盒式模糊</button><button data-filter="motion">动感模糊</button><button data-filter="radial">径向模糊</button><button data-filter="sharpen">锐化</button><button data-filter="unsharp">USM 锐化</button><button data-filter="stroke">描边</button><button data-filter="invert">反相</button></div><div class="control-row compact"><label for="effect-radius">强度 <output id="effect-radius-value">6</output></label><input id="effect-radius" type="range" min="1" max="24" value="6"></div></section>
<section class="panel tabs-panel"><div class="tabs"><button class="tab active" data-tab="layers">图层</button><button class="tab" data-tab="channels">通道</button><button class="tab" data-tab="history">历史</button></div><div class="tab-content active" id="layers-tab"><div class="layer-controls"><button id="add-layer" title="新建图层">＋</button><button id="duplicate-layer" title="复制图层">⧉</button><button id="delete-layer" title="删除图层">−</button><button id="move-layer-up" title="上移图层">↑</button><button id="move-layer-down" title="下移图层">↓</button></div><div id="layer-list" class="layer-list"></div></div><div class="tab-content" id="channels-tab"><p class="panel-note">点击通道可独立查看和编辑。RGB 模式会显示合成结果。</p><div id="channel-list" class="channel-list"></div></div><div class="tab-content" id="history-tab"><div id="history-list" class="history-list"></div></div></section></aside></main>
<dialog id="new-dialog"><form method="dialog"><h2>新建画布</h2><label>宽度 <input id="new-width" type="number" min="16" max="8192" value="1280"> px</label><label>高度 <input id="new-height" type="number" min="16" max="8192" value="720"> px</label><label>背景 <input id="new-background" type="color" value="#ffffff"></label><div class="dialog-actions"><button value="cancel">取消</button><button id="create-document" value="default" class="primary">创建</button></div></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
